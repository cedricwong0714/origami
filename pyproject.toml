[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origami"
version = "0.1.0"
description = "ORIGAMI — mechanism-aware design engine for CLASP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ui = [
  "streamlit>=1.30",
  "plotly>=5.18",
  "pandas>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
ml = [
  "gpytorch>=1.11",
  "sentence-transformers>=2.2",
  "xgboost>=2.0",
]
bio = [
  "biopython>=1.81",
]

[project.scripts]
origami = "src.ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "origami*", "sandbox*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
