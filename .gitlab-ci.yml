# ORIGAMI CI — pytest on every pipeline; GitLab Pages for static web demos.

image: python:3.12

stages:
  - test
  - deploy

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

pytest:
  stage: test
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - python -m pytest -q --junitxml=report.xml
    - origami validate-learn
      data/stage1_ingestion/examples/learn_product_timeseries/SYN_LEARN_001.csv
      data/stage1_ingestion/examples/learn_product_timeseries/SYN_LEARN_001.metadata.json
    - origami optimize --radius-a 45 --radius-b 25 --interaction Metabolic
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp web/index.html public/index.html
    - cp web/ctpr_scaffold_optimizer.html public/ctpr_scaffold_optimizer.html
    - cp web/README.md public/README.md
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
