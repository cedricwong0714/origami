# ORIGAMI CI — pytest on every pipeline; GitLab Pages for static web demos.
# Note: ISEF group runners typically pick up protected/default-branch pipelines first.
# Merge to main to refresh GitLab Pages (pages job runs only on default branch).

image: python:3.12

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - deploy

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

pytest:
  stage: test
  interruptible: true
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - python -m pytest -q --junitxml=report.xml
    - >
      origami validate-learn
      data/stage1_ingestion/examples/learn_product_timeseries/SYN_LEARN_001.csv
      data/stage1_ingestion/examples/learn_product_timeseries/SYN_LEARN_001.metadata.json
    - origami optimize --radius-a 45 --radius-b 25 --interaction Metabolic
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  interruptible: true
  script:
    - sh scripts/build_pages.sh public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
